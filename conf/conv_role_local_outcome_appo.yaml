defaults:
  - conv_role_local_stage3
  - _self_

name: conv_role_local_outcome_appo
group: role_local_outcome_appo

# Locked role_05376 weights. Rot180 remains a deployment-time inference
# augmentation and does not alter the checkpoint parameter structure.
load_dir: D:/Luxai/Kaggle_Lux_AI_2021/outputs/role_only_repair
checkpoint_file: 05376.pt
weights_only: true

# Train only the compact Role bias layer and Role-Conditioned Local Adapter.
# Actor/backbone, policy/value heads, Sidecar, and Gate stay frozen.
role_only_training: false
role_local_training: false
role_local_bias_training: true
role_bias_training_enabled: true
role_local_adapter_enabled: true
role_joint_head_training: false
spatial_risk_sidecar_enabled: false
risk_gate_enabled: false
use_aux_risk: false

role_assignment:
  enabled: true
  bias_enabled: true
  learnable_biases: false
  cooldown_turns: 5
  firefighter_override_cooldown: true
  preserve_build_city_logit: true
  abandon_city_nights: 0.25
  abandon_min_turn: 30
  abandon_confirmation_turns: 3
  abandon_max_cities: 1
  abandon_max_fraction: 0.10
  abandon_min_city_count: 3
  abandon_min_fuel_distance: 6
  abandon_rescue_distance: 6
  bias_scale_by_map_size: {12: 0.0, 16: 1.0, 24: 0.35, 32: 0.25}

# Outcome-only online RL. GameResultReward is zero until the terminal result.
reward_space: GameResultReward
reward_space_kwargs: {}
algo: appo_vtrace
rl_policy_cost: 1.0
upgo_cost: 0.0

# The immutable best Actor is a low-strength drift anchor, not a reward source.
use_teacher: true
reference_policy_kl_cost: 0.003
teacher_bc_cost_start: 0.0
teacher_bc_cost_end: 0.0
teacher_bc_anneal_games: 1
teacher_baseline_cost: 0.0

env_configuration:
  width: 24
  height: 24
  loglevel: 0
  trainingMapSizes: [16, 16, 16, 24, 24, 24, 24, 32, 32, 32]
  trainingMapSampling: random

role_small_map_policy_weight: 1.0
role_hard_window_weight: 1.0
role_local_learning_rate: 1.0e-5
role_bias_learning_rate: 2.0e-6
optimizer_kwargs:
  lr: 1.0e-6
  eps: 0.0003

batch_size: 16
total_games: 50
checkpoint_freq: 5000
console_log_interval: 15.0
checkpoint_dir: D:/Luxai/Kaggle_Lux_AI_2021/outputs/role_local_outcome_appo

hydra:
  run:
    dir: outputs/role_local_outcome_appo/${now:%Y-%m-%d_%H-%M-%S}
