defaults:
  - conv_c_group_failure_curriculum
  - _self_

name: conv_teacher_joint_vs_first
group: teacher_joint_vs_first

# Step-0 starts from the certified role_05376 Actor. The backbone stays frozen;
# policy/value heads and compact role adapters can move.
load_dir: D:/Luxai/Kaggle_Lux_AI_2021/outputs/role_only_repair
checkpoint_file: 05376.pt
weights_only: true
role_joint_head_training: true
role_local_bias_training: false
role_local_training: false

# First controls the non-learner player in every rollout.
fixed_opponent_config: D:/Luxai/Kaggle_Lux_AI_2021/internal_testing/hall_of_fame/11-24_12-56-23_062179520_must_research/lux_ai/rl_agent/config.yaml
fixed_opponent_checkpoint: D:/Luxai/Kaggle_Lux_AI_2021/internal_testing/hall_of_fame/11-24_12-56-23_062179520_must_research/lux_ai/rl_agent/062179520_weights.pt

reward_space: GameResultReward
reward_space_kwargs: {}
algo: appo_vtrace
rl_policy_cost: 1.0
upgo_cost: 0.0

# best_agent remains a weak immutable anchor while First supplies outcome reward.
use_teacher: true
reference_policy_kl_cost: 0.003
teacher_bc_cost_start: 0.01
teacher_bc_cost_end: 0.01
teacher_bc_anneal_games: 1
teacher_baseline_cost: 0.0

env_configuration:
  width: 24
  height: 24
  loglevel: 0
  trainingMapSizes: [16, 16, 16, 24, 24, 24, 24, 32]
  trainingMapSampling: random

policy_head_learning_rate: 2.0e-6
role_local_learning_rate: 2.0e-5
role_bias_learning_rate: 2.0e-6
optimizer_kwargs:
  lr: 1.0e-6
  eps: 0.0003

num_actors: 1
n_actor_envs: 2
batch_size: 16
total_games: 50
checkpoint_freq: 5000
console_log_interval: 15.0
checkpoint_dir: D:/Luxai/Kaggle_Lux_AI_2021/outputs/teacher_joint_vs_first

hydra:
  run:
    dir: outputs/teacher_joint_vs_first/${now:%Y-%m-%d_%H-%M-%S}
