defaults:
  - conv_role_local_outcome_appo
  - _self_

name: conv_role_vs_first_targeted
group: role_vs_first_targeted

# Frozen deployed First model controls the non-learner side in every rollout.
fixed_opponent_config: D:/Luxai/Kaggle_Lux_AI_2021/internal_testing/hall_of_fame/11-24_12-56-23_062179520_must_research/lux_ai/rl_agent/config.yaml
fixed_opponent_checkpoint: D:/Luxai/Kaggle_Lux_AI_2021/internal_testing/hall_of_fame/11-24_12-56-23_062179520_must_research/lux_ai/rl_agent/062179520_weights.pt

# Train only Role bias and Local Adapter. The Actor and all policy/value heads
# remain frozen. Outcome reward is the only optimization target.
role_local_bias_training: true
role_local_training: false
role_joint_head_training: false
reward_space: GameResultReward
reward_space_kwargs: {}
algo: appo_vtrace
rl_policy_cost: 1.0
upgo_cost: 0.0

# Retain a weak best-Agent anchor while allowing opponent-specific action flips.
use_teacher: true
reference_policy_kl_cost: 0.001
teacher_bc_cost_start: 0.0
teacher_bc_cost_end: 0.0
teacher_bc_anneal_games: 1
teacher_baseline_cost: 0.0

role_assignment:
  enabled: true
  bias_enabled: true
  learnable_biases: false
  cooldown_turns: 5
  firefighter_override_cooldown: true
  preserve_build_city_logit: true
  bias_disabled_map_sizes: [12]
  bias_scale_by_map_size: {12: 0.0, 16: 0.60, 24: 0.50, 32: 0.30}

# The measured weakness against First is concentrated on 16 and 24.
env_configuration:
  width: 24
  height: 24
  loglevel: 0
  trainingMapSizes: [16, 16, 24, 24, 24]
  trainingMapSampling: random

role_local_learning_rate: 2.0e-5
role_bias_learning_rate: 2.0e-6
optimizer_kwargs:
  lr: 1.0e-6
  eps: 0.0003

num_actors: 1
n_actor_envs: 2
batch_size: 16
total_games: 100
checkpoint_freq: 5000
console_log_interval: 15.0
checkpoint_dir: D:/Luxai/Kaggle_Lux_AI_2021/outputs/role_vs_first_targeted

hydra:
  run:
    dir: outputs/role_vs_first_targeted/${now:%Y-%m-%d_%H-%M-%S}
