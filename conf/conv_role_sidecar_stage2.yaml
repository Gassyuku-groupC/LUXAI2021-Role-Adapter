defaults:
  - conv_role_only_stage1
  - _self_

name: conv_role_sidecar_stage2
group: role_sidecar_stage2

# Start from the screened role_05376 policy. The best Actor inside this
# checkpoint remains the immutable student backbone.
load_dir: D:/Luxai/Kaggle_Lux_AI_2021/outputs/role_only_repair
checkpoint_file: 05376.pt
weights_only: true

role_only_training: false
role_sidecar_training: true
sidecar_freeze_base_agent: true
role_bias_training_enabled: true

# Two optimizer groups. LambdaLR applies the same schedule multiplier while
# retaining their 1:5 learning-rate ratio.
sidecar_learning_rate: 1.0e-06
role_bias_learning_rate: 5.0e-06
optimizer_kwargs:
  lr: 1.0e-06
  eps: 0.0003

use_teacher: true
reference_policy_kl_cost: 0.01
teacher_bc_cost_start: 0.05
teacher_bc_cost_end: 0.05
teacher_bc_anneal_games: 1

risk_gate_enabled: false
use_aux_risk: false
batch_size: 16
checkpoint_freq: 5000
console_log_interval: 15.0
total_games: 100
checkpoint_dir: D:/Luxai/Kaggle_Lux_AI_2021/outputs/role_sidecar_stage2

hydra:
  run:
    dir: outputs/role_sidecar_stage2/${now:%Y-%m-%d_%H-%M-%S}
